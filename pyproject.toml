[project]
name = "porto"
version = "0.1.0"
description = "AI-native PRD decomposition system"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
	"pytest>=8.0",
	"ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "skills/scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
