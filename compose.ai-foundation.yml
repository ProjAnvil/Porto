name: ai-foundation

services:
  postgres-vector:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_DB: ${AI_FOUNDATION_POSTGRES_DB:-porto}
      POSTGRES_USER: ${AI_FOUNDATION_POSTGRES_USER:-porto}
      POSTGRES_PASSWORD: ${AI_FOUNDATION_POSTGRES_PASSWORD:-porto-local-dev}
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - ./data/ai-foundation/postgres:/var/lib/postgresql
      - ./infrastructure/ai-foundation/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:28000:8000"
    volumes:
      - ./data/ai-foundation/chroma:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          while read -r _ local _ state _; do
            case "$${local}:$${state}" in *:1F40:0A) exit 0;; esac;
          done < /proc/net/tcp;
          exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./data/ai-foundation/milvus/etcd:/etcd
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command:
      - minio
      - server
      - /minio_data
      - --console-address
      - :9001
    volumes:
      - ./data/ai-foundation/milvus/minio:/minio_data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.6.22
    command:
      - milvus
      - run
      - standalone
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    ports:
      - "127.0.0.1:29530:19530"
    volumes:
      - ./data/ai-foundation/milvus/data:/var/lib/milvus
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9091/healthz
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ai-foundation
    driver: bridge
